<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#bfe3e0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <title>观影手记</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <h1 class="app-title">观影手记</h1>
    </header>

    <main id="view" class="view"><!-- 视图渲染区 --></main>

    <button id="fab" class="fab" title="添加电影" aria-label="添加电影">＋</button>

    <nav class="tabbar">
      <button class="tab" data-route="#/list"><span class="tab-ico">🎬</span><span class="tab-txt">电影库</span></button>
      <button class="tab" data-route="#/stats"><span class="tab-ico">📊</span><span class="tab-txt">统计</span></button>
      <button class="tab" data-route="#/settings"><span class="tab-ico">⚙️</span><span class="tab-txt">设置</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- 脚本按顺序加载（经典 script，零构建） -->
  <script src="js/db.js"></script>
  <script src="js/util.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/list.js"></script>
  <script src="js/views/detail.js"></script>
  <script src="js/views/edit.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
