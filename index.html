<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#a9d6e5" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" href="assets/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icon-192.png" />
  <title>观影手记</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="splash" aria-hidden="true">
    <div class="splash-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><line x1="8" y1="4" x2="8" y2="20"/><line x1="16" y1="4" x2="16" y2="20"/><line x1="3" y1="9" x2="8" y2="9"/><line x1="16" y1="9" x2="21" y2="9"/><line x1="3" y1="15" x2="8" y2="15"/><line x1="16" y1="15" x2="21" y2="15"/></svg>
    </div>
    <div class="splash-name">观影手记</div>
    <div class="splash-sub">记录每一帧心动</div>
  </div>
  <div id="app">
    <header class="app-header">
      <h1 class="app-title">观影手记</h1>
    </header>

    <main id="view" class="view"><!-- 视图渲染区 --></main>

    <button id="fab" class="fab" title="添加电影" aria-label="添加电影">＋</button>
    <button id="fabAssistant" class="fab fab-assistant" title="Hermes 观影助手" aria-label="Hermes 观影助手"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.5 8.5 0 0 1-12 7.7L3 21l1.8-6A8.5 8.5 0 1 1 21 11.5z"/></svg></button>

    <nav class="tabbar">
      <button class="tab" data-route="#/discover"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.6"/><rect x="14" y="3" width="7" height="7" rx="1.6"/><rect x="3" y="14" width="7" height="7" rx="1.6"/><rect x="14" y="14" width="7" height="7" rx="1.6"/></svg></span><span class="tab-txt">电影库</span></button>
      <button class="tab" data-route="#/list"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4-7 4V4a1 1 0 0 1 1-1z"/></svg></span><span class="tab-txt">我的电影库</span></button>
      <button class="tab" data-route="#/stats"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="20" x2="20" y2="20"/><line x1="7.5" y1="20" x2="7.5" y2="12"/><line x1="12" y1="20" x2="12" y2="6"/><line x1="16.5" y1="20" x2="16.5" y2="14"/></svg></span><span class="tab-txt">统计</span></button>
      <button class="tab" data-route="#/profile"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.6"/><path d="M4.5 20c0-4 3.5-6.2 7.5-6.2S19.5 16 19.5 20"/></svg></span><span class="tab-txt">个人</span></button>
      <button class="tab" data-route="#/settings"><span class="tab-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1.1-1.5 1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.5-1.1 1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1z"/></svg></span><span class="tab-txt">设置</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- 脚本按顺序加载（经典 script，零构建） -->
  <script src="js/db.js"></script>
  <script src="js/sync.js"></script>
  <script src="js/util.js"></script>
  <script src="js/tmdb.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/router.js"></script>
  <script src="js/views/discover.js"></script>
  <script src="js/views/list.js"></script>
  <script src="js/views/detail.js"></script>
  <script src="js/views/edit.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/profile.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/views/assistant.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
